name: Translate EPG XML

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"  # 3:00 AM Vietnam time

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deep_translator langdetect

      - name: Run EPG translation
        run: |
          echo "=== Running epg_translate.py ==="
          python epg_translate.py

      - name: Commit and push translated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/epgtest-translated.xml || true
          git commit -m "Auto translate epgtest.xml → epgtest-translated.xml" || echo "No changes to commit"
          git push || echo "Push failed"
